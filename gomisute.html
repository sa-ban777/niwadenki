<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゴミ捨て表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2d6a4f;
    --green-light: #52b788;
    --green-pale: #d8f3dc;
    --bg: #f8fdf9;
    --text: #1b3a2d;
    --border: #b7dfc3;
    --gray: #6b7f74;
    --red: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header {
    background: var(--green); color: white;
    padding: 20px 32px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  header .icon { font-size: 28px; }
  header h1 { font-size: 1.4rem; font-weight: 700; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px; }

  .form-card {
    background: white; border: 1px solid var(--border);
    border-radius: 12px; padding: 20px 24px; margin-bottom: 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .form-card h2 { font-size: 1rem; color: var(--green); margin-bottom: 14px; font-weight: 700; }
  .form-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px; margin-bottom: 14px;
  }
  .form-grid input {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 0.92rem; font-family: inherit; width: 100%;
    transition: border-color 0.2s;
  }
  .form-grid input:focus { outline: none; border-color: var(--green-light); box-shadow: 0 0 0 3px rgba(82,183,136,0.15); }
  .form-grid input::placeholder { color: #aac4b2; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 20px; border: none; border-radius: 8px;
    font-size: 0.92rem; font-family: inherit; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-primary { background: var(--green); color: white; }
  .btn-primary:hover { background: #245a40; }
  .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
  .btn-edit { background: var(--green-pale); color: var(--green); font-size: 0.82rem; padding: 5px 12px; }
  .btn-edit:hover { background: #bce7c9; }
  .btn-delete { background: #fde8e8; color: var(--red); font-size: 0.82rem; padding: 5px 12px; }
  .btn-delete:hover { background: #f5c0c0; }

  #status {
    padding: 10px 14px; border-radius: 8px; margin-bottom: 18px;
    font-size: 0.88rem; display: none;
  }
  #status.info    { background: #e8f4fd; color: #1a6fa0; display: block; }
  #status.success { background: #e8f8ee; color: #1a7a3e; display: block; }
  #status.error   { background: #fde8e8; color: var(--red); display: block; }

  .table-wrap {
    background: white; border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--green); color: white; }
  th {
    padding: 12px 14px; text-align: left; font-size: 0.88rem; font-weight: 600;
    white-space: nowrap; cursor: pointer; user-select: none; transition: background 0.15s;
  }
  th:last-child { cursor: default; }
  th:not(:last-child):hover { background: #245a40; }
  th .sort-icon { margin-left: 4px; opacity: 0.6; font-size: 0.75rem; }
  th.sorted .sort-icon { opacity: 1; }
  td { padding: 11px 14px; font-size: 0.9rem; border-top: 1px solid var(--border); vertical-align: middle; }
  tr:nth-child(even) td { background: #f4fbf6; }
  tr:hover td { background: var(--green-pale); transition: background 0.15s; }
  .td-ops { white-space: nowrap; }
  .td-ops button + button { margin-left: 6px; }
  .empty-msg { text-align: center; color: var(--gray); padding: 40px; font-size: 0.95rem; }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 100;
    justify-content: center; align-items: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white; border-radius: 14px; padding: 28px 28px 24px;
    width: 90%; max-width: 480px; box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }
  .modal h3 { font-size: 1rem; color: var(--green); margin-bottom: 16px; }
  .modal-grid { display: grid; gap: 10px; margin-bottom: 20px; }
  .modal-grid label { font-size: 0.82rem; color: var(--gray); margin-bottom: 2px; display: block; }
  .modal-grid input {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 0.92rem; font-family: inherit; width: 100%;
  }
  .modal-grid input:focus { outline: none; border-color: var(--green-light); box-shadow: 0 0 0 3px rgba(82,183,136,0.15); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-cancel { background: #f0f0f0; color: var(--text); }
  .btn-cancel:hover { background: #e0e0e0; }
</style>
</head>
<body>
<header>
  <span class="icon">♻️</span>
  <h1>ゴミ捨て表</h1>
</header>
<main>
  <div id="status"></div>

  <div class="form-card">
    <h2>＋ 新しいアイテムを追加</h2>
    <div class="form-grid">
      <input id="f_name"  placeholder="品名（例：新聞紙）">
      <input id="f_type"  placeholder="種別（例：資源ゴミ）">
      <input id="f_how"   placeholder="捨て方（例：束ねて）">
      <input id="f_where" placeholder="捨てる場所">
      <input id="f_note"  placeholder="備考">
    </div>
    <button class="btn btn-primary" onclick="addRow()" id="addBtn">追加する</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy(0)" id="th0">品名 <span class="sort-icon">↕</span></th>
          <th onclick="sortBy(1)" id="th1">種別 <span class="sort-icon">↕</span></th>
          <th onclick="sortBy(2)" id="th2">捨て方 <span class="sort-icon">↕</span></th>
          <th onclick="sortBy(3)" id="th3">捨てる場所 <span class="sort-icon">↕</span></th>
          <th onclick="sortBy(4)" id="th4">備考 <span class="sort-icon">↕</span></th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="6" class="empty-msg">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- 編集モーダル -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>✏️ 編集</h3>
    <div class="modal-grid">
      <div><label>品名</label><input id="m_name"></div>
      <div><label>種別</label><input id="m_type"></div>
      <div><label>捨て方</label><input id="m_how"></div>
      <div><label>捨てる場所</label><input id="m_where"></div>
      <div><label>備考</label><input id="m_note"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxjSfgXnSj7fZz4CBpPYW1yRqW1BXuCzrv3LaZ6KEYAxfwxK1beFRrwlecgy_m22TjsKQ/exec";

let data = [];
let sortCol = -1;
let sortAsc = true;
let editIdx = -1;

function setStatus(msg, type) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = type;
  if (type === "success") setTimeout(() => { el.style.display="none"; el.className=""; }, 3000);
}

function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Date.now();
    const script = document.createElement("script");
    window[cb] = (d) => { delete window[cb]; document.body.removeChild(script); resolve(d); };
    script.onerror = () => { delete window[cb]; document.body.removeChild(script); reject(new Error("JSONP failed")); };
    script.src = url + "&callback=" + cb;
    document.body.appendChild(script);
  });
}

async function load() {
  setStatus("データを読み込み中...", "info");
  try {
    data = await jsonp(GAS_URL + "?action=get");
    document.getElementById("status").style.display = "none";
    document.getElementById("status").className = "";
    render();
  } catch(e) {
    setStatus("読み込みエラー: " + e.message, "error");
    document.getElementById("tbody").innerHTML = `<tr><td colspan="6" class="empty-msg">データの読み込みに失敗しました</td></tr>`;
  }
}

const KEYS = ["品名","種別","捨て方","捨てる場所","備考"];
function render() {
  const tb = document.getElementById("tbody");
  if (data.length === 0) {
    tb.innerHTML = `<tr><td colspan="6" class="empty-msg">データがありません。上のフォームから追加してください。</td></tr>`;
    return;
  }
  tb.innerHTML = data.map((r, i) => `
    <tr>
      <td>${esc(r.品名)}</td>
      <td>${esc(r.種別)}</td>
      <td>${esc(r.捨て方)}</td>
      <td>${esc(r.捨てる場所)}</td>
      <td>${esc(r.備考)}</td>
      <td class="td-ops">
        <button class="btn btn-edit" onclick="openEdit(${i})">編集</button>
        <button class="btn btn-delete" onclick="deleteRow(${i})">削除</button>
      </td>
    </tr>`).join("");
}
function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function sortBy(col) {
  sortAsc = (sortCol === col) ? !sortAsc : true;
  sortCol = col;
  KEYS.forEach((_, i) => {
    document.getElementById("th"+i).classList.remove("sorted");
    document.getElementById("th"+i).querySelector(".sort-icon").textContent = "↕";
  });
  document.getElementById("th"+col).classList.add("sorted");
  document.getElementById("th"+col).querySelector(".sort-icon").textContent = sortAsc ? "↑" : "↓";
  const key = KEYS[col];
  data.sort((a,b) => {
    const v = (a[key]||"").localeCompare(b[key]||"", "ja");
    return sortAsc ? v : -v;
  });
  render();
}

async function addRow() {
  const name = document.getElementById("f_name").value.trim();
  if (!name) { setStatus("品名は必須です", "error"); return; }
  await callGAS({
    action:    "add",
    品名:      name,
    種別:      document.getElementById("f_type").value.trim(),
    捨て方:    document.getElementById("f_how").value.trim(),
    捨てる場所: document.getElementById("f_where").value.trim(),
    備考:      document.getElementById("f_note").value.trim()
  });
  ["f_name","f_type","f_how","f_where","f_note"].forEach(id => document.getElementById(id).value="");
}

async function deleteRow(i) {
  if (!confirm(`「${data[i].品名}」を削除しますか？`)) return;
  await callGAS({ action: "delete", index: i });
}

function openEdit(i) {
  editIdx = i;
  const r = data[i];
  document.getElementById("m_name").value  = r.品名||"";
  document.getElementById("m_type").value  = r.種別||"";
  document.getElementById("m_how").value   = r.捨て方||"";
  document.getElementById("m_where").value = r.捨てる場所||"";
  document.getElementById("m_note").value  = r.備考||"";
  document.getElementById("modalOverlay").classList.add("open");
}
function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
  editIdx = -1;
}
async function saveEdit() {
  await callGAS({
    action:    "edit",
    index:     editIdx,
    品名:      document.getElementById("m_name").value.trim(),
    種別:      document.getElementById("m_type").value.trim(),
    捨て方:    document.getElementById("m_how").value.trim(),
    捨てる場所: document.getElementById("m_where").value.trim(),
    備考:      document.getElementById("m_note").value.trim()
  });
  closeModal();
}
document.getElementById("modalOverlay").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});

async function callGAS(params) {
  setStatus("保存中...", "info");
  document.getElementById("addBtn").disabled = true;
  try {
    const query = Object.entries(params)
      .map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v))
      .join("&");
    await jsonp(GAS_URL + "?" + query);
    setStatus("保存しました ✓", "success");
    await load();
  } catch(e) {
    setStatus("エラー: " + e.message, "error");
  } finally {
    document.getElementById("addBtn").disabled = false;
  }
}

load();
</script>
</body>
</html>
